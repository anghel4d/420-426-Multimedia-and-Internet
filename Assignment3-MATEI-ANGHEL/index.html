	<title>SpaceX Fan InfoSite</title>
	<link rel="stylesheet" href="./style.css"/>
</head>
<body>
	<header>
		<img id="banner" src="images/spacexbanner.jpg"/>
	</header>
	<main>
	<img id="timer-image" class="background-img"></img>
		<div id="timer-text" class="content">
			<h1 id="timer-clock">
				<span id="t-Days">DD:</span>
				<span id="t-Hours">hh:</span>
				<span id="t-Minutes">mm:</span>
				<span id="t-Seconds">ss</span>
			</h1>
			<h3>Until Next Launch</h3>
			<hr/>
			<h2>
				On <span id="nextDate">DD/MM/YYYY</span>
			</h2>
			<h2>
				At <span id="nextSite">[Place]</span>
			</h2>
		</div>
	</main>
	<nav>
		<ul class="nav-buttons">
			<li><a href="launches.html">Launches</a></li>
			<li><a href="rockets.html">Rockets</a></li>
		</ul>
	</nav>
	<script src="main.js"></script>
